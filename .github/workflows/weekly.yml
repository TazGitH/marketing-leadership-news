name: Busca semanal - movimentos de liderança de marketing

on:
  schedule:
    # Toda segunda-feira às 08:00 (horário de Brasília = UTC-3 -> 11:00 UTC)
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar-e-classificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python src/main.py

      - name: Salvar banco de deduplicação atualizado
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/seen.sqlite3
          git diff --staged --quiet || git commit -m "chore: atualizar banco de dedup"
          git push
